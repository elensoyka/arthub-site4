<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Занятие — ArtHub Tbilisi</title>
<meta name="description" content="Подробная программа занятий, стоимость, преподаватель и запись в ArtHub Tbilisi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Roboto+Condensed:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<style>
:root{--p-blue:#1742bd;--p-lime:#d0e102;--p-ink:#203c89;--p-white:#fff;--p-line:#d9e3fb}
*{box-sizing:border-box}
body{margin:0;background:#f8faff;color:var(--p-blue);font-family:Manrope,Arial,sans-serif}
.detail-shell{max-width:1180px;margin:0 auto;padding:18px 20px 90px}
.detail-nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.detail-nav a{color:var(--p-blue);font-size:13px;font-weight:800;text-decoration:none}
.detail-nav .spacer{flex:1}
.lang-button{color:var(--p-blue);border:1px solid var(--p-line);background:white;border-radius:25px;padding:9px 14px;font-weight:900;cursor:pointer}
.lang-button[aria-pressed=true]{background:var(--p-lime);border-color:var(--p-lime)}
.detail-hero{background:var(--p-blue);color:white;padding:clamp(30px,6vw,72px);border-radius:28px;position:relative;overflow:hidden;min-height:365px}
.detail-hero:after{content:"";position:absolute;right:-55px;top:-70px;width:clamp(180px,28vw,340px);height:clamp(180px,28vw,340px);background:url('../arthub-star.svg') center/contain no-repeat;pointer-events:none}
.detail-hero .eyebrow,.detail-hero h1,.detail-hero p{position:relative;z-index:1;max-width:780px}
.detail-hero .eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:12px;font-weight:900}
.detail-hero h1{font:800 clamp(46px,7vw,95px)/.97 'Roboto Condensed',Arial,sans-serif;margin:20px 0 24px;letter-spacing:-.04em}
.detail-hero p{font-size:clamp(14px,2vw,18px);line-height:1.65}
.detail-tag{display:inline-block;background:var(--p-lime);color:var(--p-blue);border-radius:25px;padding:9px 14px;font-size:12px;font-weight:900}
.detail-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(255px,1fr);align-items:start;gap:20px;margin-top:22px}
.detail-content{display:flex;flex-direction:column;gap:20px}
.detail-box{border:1px solid var(--p-line);border-radius:22px;background:white;padding:clamp(24px,4vw,38px)}
.detail-box h2{font:800 clamp(32px,4vw,47px)/1 'Roboto Condensed',Arial,sans-serif;margin:0 0 17px}
.detail-box p{line-height:1.8;font-size:15px;margin:0 0 16px}
.detail-box p:last-child{margin-bottom:0}
.detail-label{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;color:#5373b8}
.detail-facts{display:grid;gap:0}
.detail-fact{padding:14px 0;border-bottom:1px solid var(--p-line)}
.detail-fact:first-child{padding-top:0}.detail-fact:last-child{border-bottom:0;padding-bottom:0}
.detail-fact strong{display:block;font-size:16px;line-height:1.55;margin-top:6px}
.detail-fact a{color:var(--p-blue);text-decoration:underline;text-underline-offset:3px}
.detail-registration{background:var(--p-lime);border:0}
.detail-registration h2{font-size:39px}
.detail-registration .register{display:inline-block;text-decoration:none;background:var(--p-blue);color:white;border-radius:35px;padding:15px 26px;font-weight:900;margin:10px 0 12px}
.detail-registration .note{font-size:13px}
#notFound{display:none;padding:35px;background:white;border-radius:15px}
@media(max-width:780px){.detail-layout{grid-template-columns:1fr}.detail-hero{min-height:0}.detail-hero:after{opacity:.22}.detail-hero h1{font-size:56px}.detail-shell{padding-left:12px;padding-right:12px}}
</style><link rel="icon" href="/arthub-star.svg" type="image/svg+xml"><meta name="robots" content="noindex, follow"></head>
<body><main class="detail-shell">
<nav class="detail-nav">
<a id="back" href="index.html" data-ru="← Все занятия" data-en="← All classes">← Все занятия</a>
<a href="../teachers/index.html" data-ru="Преподаватели" data-en="Teachers">Преподаватели</a>
<span class="spacer"></span>
<button class="lang-button" data-lang="ru" aria-pressed="true" type="button">RU</button>
<button class="lang-button" data-lang="en" aria-pressed="false" type="button">EN</button>
</nav>
<section id="notFound" data-ru="Занятие не найдено. Вернитесь в расписание." data-en="This class was not found. Please return to the timetable.">Занятие не найдено. Вернитесь в расписание.</section>
<section id="detailBody" hidden>
<header class="detail-hero">
<span class="eyebrow">ARTHUB TBILISI / PROGRAMME</span>
<h1 id="detailTitle"></h1>
<span class="detail-tag" id="detailStatus"></span>
<p id="detailIntro"></p>
</header>
<div class="detail-layout">
<div class="detail-content">
<section class="detail-box"><h2 id="aboutHeading"></h2><p id="detailDescription"></p></section>
<section class="detail-box"><h2 id="howHeading"></h2><p id="detailHow"></p></section>
<section class="detail-box"><h2 id="teacherHeading"></h2><div id="detailTeachers"></div></section>
</div>
<aside class="detail-content">
<section class="detail-box detail-facts" id="detailFacts"></section>
<section class="detail-box detail-registration"><h2 id="registrationHeading"></h2><p id="registrationText"></p><a class="register" href="https://t.me/arthub_tbilisi" target="_blank" rel="noopener noreferrer" id="registrationLink"></a><p class="note" id="registrationNote"></p></section>
</aside>
</div>
</section>
</main>
<script src="programme.js?v=20261116-compact"></script>
<script src="detail.js?v=20261123-seo"></script>
</body></html>
